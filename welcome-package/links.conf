# Links that can change between cohorts.
#
# Edit, then run ./build.sh. Each link is filled into welcome-package.html
# wherever {{NAME}} appears, and gets a QR code in qr/.

# Discord invite: the general, public invite. This repo is public, so don't put
# a cohort invite that grants a role here.
DISCORD_INVITE_URL="https://discord.gg/XVHMTefzDe"
# Course repo: students fork it and run ./course-setup.sh (which runs the
# preflight). Only the QR code uses this; the fork command on the Preflight
# page names the repo as Mustry-Academy/cicd-for-ignition, so change both.
COURSE_REPO_URL="https://github.com/Mustry-Academy/cicd-for-ignition"
SURVEY_URL="https://mustry-solutions-odoo.odoo.com/survey/start/ed54925c-ceb5-45d6-99e1-e771fa470064"
