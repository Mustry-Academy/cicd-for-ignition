# pre-commit configuration for the lab.
# Part 1 stretch target — wires Part 1's linters into a pre-commit hook
# so bad commits are blocked locally before they ever reach CI.
#
# Setup:
#   pip install pre-commit
#   scripts/setup.sh   # sets core.hooksPath once for the whole repo
#
# The repo's pre-commit dispatcher (scripts/git-hooks/pre-commit at the repo
# root) runs this file FROM THE REPO ROOT whenever you commit a change under
# labs/03-github-actions/. So every `files:` regex and every path in `args:`
# is repo-root-relative.
#
# Run all hooks on the whole lab (works from the lab folder):
#   pre-commit run --all-files --config .pre-commit-config.yaml

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: ^(labs/03-github-actions/|\.github/workflows/lab03-)
        args: ["-c", "labs/03-github-actions/.yamllint.yml"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^labs/03-github-actions/.*\.sh$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint
        files: ^\.github/workflows/lab03-
        args: ["-config-file", "labs/03-github-actions/.github/actionlint.yaml"]

  # iglint, the Ignition-native linter: views, scripts, expressions and the
  # references between them, with the lab's iglint.toml. A staged project file
  # lints the whole lab, so a rename that breaks another view is caught too.
  - repo: local
    hooks:
      - id: iglint
        name: iglint
        entry: iglint check labs/03-github-actions
        language: python
        additional_dependencies:
          - "iglint==0.1.0"
        files: ^labs/03-github-actions/.*\.(json|py)$
        pass_filenames: false
        require_serial: true
