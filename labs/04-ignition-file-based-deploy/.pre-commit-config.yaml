# pre-commit configuration for the lab.
# Wires the same linters CI runs into a local git hook, so bad commits are
# blocked before they ever reach CI. Carried over from Lab 03 for consistency.
#
# Setup:
#   pip install pre-commit
#   scripts/setup.sh   (points git at the repo-root hook dispatcher, which runs
#                       this config whenever a commit touches this lab)
#
# The dispatcher runs it from the REPO ROOT, so every path below is
# root-relative and every hook is scoped to this lab's files. To run all hooks
# on the whole lab by hand, from the repo root:
#   pre-commit run --all-files --config labs/04-ignition-file-based-deploy/.pre-commit-config.yaml

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: ^(labs/04-ignition-file-based-deploy/|\.github/workflows/lab04-)
        args: ["-c", "labs/04-ignition-file-based-deploy/.yamllint.yml"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^labs/04-ignition-file-based-deploy/.*\.sh$
        # -x follows the sourced lib.sh; source resolution comes from .shellcheckrc
        args: ["-x"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint
        # This lab's workflows live at the repo root as lab04-*.yml.
        files: ^\.github/workflows/lab04-.*\.ya?ml$
        args: ["-config-file", "labs/04-ignition-file-based-deploy/.github/actionlint.yaml"]

  # iglint, the Ignition-native linter: views, scripts, expressions and the
  # references between them, with the lab's iglint.toml. A staged project file
  # lints the whole lab, so a rename that breaks another view is caught too.
  # iglint is not on PyPI yet: pip takes its wheel from the GitHub release.
  - repo: local
    hooks:
      - id: iglint
        name: iglint
        entry: iglint check labs/04-ignition-file-based-deploy
        language: python
        additional_dependencies:
          - "--find-links=https://github.com/Mustry-Solutions/iglint/releases/expanded_assets/v0.1.0"
          - "iglint==0.1.0"
        files: ^labs/04-ignition-file-based-deploy/.*\.(json|py)$
        pass_filenames: false
        require_serial: true
