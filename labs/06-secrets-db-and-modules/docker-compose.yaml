name: cicd-lab06

x-ignition-env: &ignition-env
  ACCEPT_IGNITION_EULA: "Y"
  IGNITION_EDITION: standard
  DISABLE_QUICKSTART: "true"
  GATEWAY_MODULES_ENABLED: >-
    com.inductiveautomation.alarm-notification,
    com.inductiveautomation.eventstream,
    com.inductiveautomation.historian,
    com.inductiveautomation.connectors.kafka,
    com.inductiveautomation.opcua.drivers.modbus,
    com.inductiveautomation.opcua,
    com.inductiveautomation.perspective,
    com.inductiveautomation.reporting,
    com.inductiveautomation.historian.sql,
    com.inductiveautomation.symbol-factory,
    com.inductiveautomation.opcua.drivers.tcpudp,
    com.inductiveautomation.webdev,
    com.inductiveautomation.jdbc.postgresql,
    dev.bwdesigngroup.flint.FlintDesignerBridge,
    project-scan-endpoint
  ACCEPT_MODULE_LICENSES: >-
    dev.bwdesigngroup.flint.FlintDesignerBridge,
    project-scan-endpoint
  ACCEPT_MODULE_CERTS: >-
    dev.bwdesigngroup.flint.FlintDesignerBridge,
    project-scan-endpoint
  GATEWAY_RESTORE_DISABLED: "true"
  GATEWAY_NETWORK_ENABLED: "true"
  TZ: "Europe/Brussels"

x-ignition-entrypoint: &ignition-entrypoint
  ["/bin/sh", "-c", 'umask 0002 && exec docker-entrypoint.sh "$@"', "--"]

x-ignition-resources: &ignition-resources
  deploy:
    resources:
      limits:
        memory: 1536M
      reservations:
        memory: 512M
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-ignition-healthcheck: &ignition-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8088/StatusPing"]
  interval: 30s
  timeout: 10s
  retries: 10
  start_period: 90s

services:
  gateway-local-development:
    image: inductiveautomation/ignition:8.3.8
    container_name: lab06-gateway-local-development
    hostname: lab06-gateway-local-development
    user: "${LAB_UID:-2003}:0"
    group_add:
      - "${LAB_GID:-0}"
    entrypoint: *ignition-entrypoint
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
      - "${GATEWAY_GAN_PORT:-8060}:8060"
    volumes:
      - gateway-local-data:/usr/local/bin/ignition/data
      - ./projects:/usr/local/bin/ignition/data/projects
      - ./services/config:/usr/local/bin/ignition/data/config
      - ./services/modules.json:/usr/local/bin/ignition/data/modules.json
      - ./third-party-modules:/third-party-modules
    environment:
      <<: *ignition-env
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME_LOCAL:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD_LOCAL:-password}"
      IGNITION_ROOT_KEY_PASSWORD: "${IGNITION_ROOT_KEY_PASSWORD:-lab06-root-key-pass}"
    command: >
      -n lab06-local
      -m 1024
      --
      wrapper.java.initmemory=256
      -Dignition.allowunsignedmodules=true
      -Dignition.gateway.externalModulesFolder=/third-party-modules
      -Dignition.config.mode=local-development
    healthcheck: *ignition-healthcheck
    <<: *ignition-resources
    networks:
      - default
    depends_on:
      timescaledb:
        condition: service_healthy

  gateway-test:
    image: inductiveautomation/ignition:8.3.8
    container_name: lab06-gateway-test
    hostname: lab06-gateway-test
    user: "2003:0"
    group_add:
      - "${LAB_GID:-0}"
    entrypoint: *ignition-entrypoint
    restart: unless-stopped
    ports:
      - "${TEST_GATEWAY_PORT:-8089}:8088"
      - "${TEST_GATEWAY_GAN_PORT:-8061}:8060"
    volumes:
      - gateway-test-data:/usr/local/bin/ignition/data
      - ./gateways/test/projects:/usr/local/bin/ignition/data/projects
      - ./gateways/test/config:/usr/local/bin/ignition/data/config
      - ./gateways/test/modules.json:/usr/local/bin/ignition/data/modules.json
      - ./third-party-modules:/third-party-modules
    environment:
      <<: *ignition-env
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME_TEST:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD_TEST:-password}"
    command: >
      -n lab06-test
      -m 1024
      --
      wrapper.java.initmemory=256
      -Dignition.allowunsignedmodules=true
      -Dignition.gateway.externalModulesFolder=/third-party-modules
      -Dignition.config.mode=test
    healthcheck: *ignition-healthcheck
    <<: *ignition-resources
    networks:
      - default
    depends_on:
      timescaledb:
        condition: service_healthy

  gateway-production:
    image: inductiveautomation/ignition:8.3.8
    container_name: lab06-gateway-production
    hostname: lab06-gateway-production
    user: "2003:0"
    group_add:
      - "${LAB_GID:-0}"
    entrypoint: *ignition-entrypoint
    restart: unless-stopped
    ports:
      - "${PRODUCTION_GATEWAY_PORT:-8090}:8088"
      - "${PRODUCTION_GATEWAY_GAN_PORT:-8062}:8060"
    volumes:
      - gateway-production-data:/usr/local/bin/ignition/data
      - ./gateways/production/projects:/usr/local/bin/ignition/data/projects
      - ./gateways/production/config:/usr/local/bin/ignition/data/config
      - ./gateways/production/modules.json:/usr/local/bin/ignition/data/modules.json
      - ./third-party-modules:/third-party-modules
    environment:
      <<: *ignition-env
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME_PRODUCTION:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD_PRODUCTION:-password}"
    command: >
      -n lab06-production
      -m 1024
      --
      wrapper.java.initmemory=256
      -Dignition.allowunsignedmodules=true
      -Dignition.gateway.externalModulesFolder=/third-party-modules
      -Dignition.config.mode=production
    healthcheck: *ignition-healthcheck
    <<: *ignition-resources
    networks:
      - default
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: lab06-timescaledb
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ignition}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lab06-postgres-pw}"
      POSTGRES_DB: ignition_local_development
      REPORTING_PASSWORD: "${REPORTING_PASSWORD:-lab06-reporting-pw}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ignition}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  github-runner:
    image: myoung34/github-runner:latest
    container_name: lab06-runner
    hostname: lab06-runner
    restart: unless-stopped
    environment:
      REPO_URL: "${RUNNER_REPO_URL}"
      ACCESS_TOKEN: "${RUNNER_GITHUB_PAT}"
      RUNNER_NAME: "${RUNNER_NAME:-lab06-runner}"
      RUNNER_SCOPE: repo
      LABELS: "self-hosted,lab06"
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

volumes:
  gateway-local-data:
  gateway-test-data:
  gateway-production-data:
  timescaledb-data:
