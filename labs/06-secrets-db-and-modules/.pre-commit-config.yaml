# pre-commit configuration for the lab.
# Wires the same linters CI runs into a local git hook, so bad commits are
# blocked before they ever reach CI. Carried over from Lab 03 for consistency.
#
# The course repo's pre-commit dispatcher (scripts/git-hooks/pre-commit at the
# repo root) runs this config FROM THE REPO ROOT whenever a commit touches this
# lab, so every hook is scoped to this lab's files and every path below is
# repo-root-relative.
#
# Setup:
#   pip install pre-commit
#   scripts/setup.sh   (points git at the dispatchers; no `pre-commit install`)
#
# Run all hooks on the full lab (from the repo root):
#   pre-commit run --config labs/06-secrets-db-and-modules/.pre-commit-config.yaml --all-files

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: ^(labs/06-secrets-db-and-modules/|\.github/workflows/lab06-)
        args: ["-c", "labs/06-secrets-db-and-modules/.yamllint.yml"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^labs/06-secrets-db-and-modules/.*\.sh$
        # -x follows the sourced lib.sh; source resolution comes from .shellcheckrc
        args: ["-x"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint
        # This lab's workflows live at the repo root, prefixed lab06-.
        files: ^\.github/workflows/lab06-.*\.ya?ml$
        args: ["-config-file", "labs/06-secrets-db-and-modules/.github/actionlint.yaml"]

  # Ignition rewrites resource.json manifests with a fresh timestamp and
  # signature whenever it touches the resource, even when nothing real changed.
  # The textconv driver only HIDES that from `git diff`; this is what actually
  # reverts it, staged or not, before it can enter a commit.
  # Background: docs/resource-json-hygiene.html
  - repo: local
    hooks:
      - id: clean-ignition-resource-churn
        name: revert junk-only resource.json rewrites
        entry: labs/06-secrets-db-and-modules/scripts/clean-ignition-resource-churn.sh --apply
        language: script
        files: ^labs/06-secrets-db-and-modules/.*resource\.json$
        pass_filenames: false

  # Ignition-native linter for Perspective views (naming, polling, scripts...).
  # The hook only fires on staged view.json files; --config points it at ours.
  - repo: https://github.com/bw-design-group/ignition-lint
    rev: v0.6.1
    hooks:
      - id: ign-lint
        files: ^labs/06-secrets-db-and-modules/.*view\.json$
        args: ["--config=labs/06-secrets-db-and-modules/rule_config.json"]
