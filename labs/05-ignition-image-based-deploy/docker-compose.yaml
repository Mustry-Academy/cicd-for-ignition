name: cicd-lab05

x-ignition-env: &ignition-env
  ACCEPT_IGNITION_EULA: "Y"
  IGNITION_EDITION: standard
  DISABLE_QUICKSTART: "true"
  ACCEPT_MODULE_LICENSES: >-
    com.mussonindustrial.embr.charts,
    com.mussonindustrial.embr.periscope,
    com.mustry.historian.timescaledb,
    dev.bwdesigngroup.flint.FlintDesignerBridge,
    project-scan-endpoint
  ACCEPT_MODULE_CERTS: >-
    com.mussonindustrial.embr.charts,
    com.mussonindustrial.embr.periscope,
    com.mustry.historian.timescaledb,
    dev.bwdesigngroup.flint.FlintDesignerBridge,
    project-scan-endpoint
  GATEWAY_RESTORE_DISABLED: "true"
  GATEWAY_NETWORK_ENABLED: "true"
  TZ: "Europe/Brussels"
  LAB_MODULES_ENABLED: "${LAB_MODULES_ENABLED:-}"

x-ignition-entrypoint: &ignition-entrypoint
  - /bin/sh
  - -c
  - >-
    umask 0002;
    if [ ! -e /usr/local/bin/ignition/data/modules.json ] && [ -n "$$LAB_MODULES_ENABLED" ];
    then export GATEWAY_MODULES_ENABLED="$$LAB_MODULES_ENABLED"; fi;
    exec docker-entrypoint.sh "$$@"
  - --

x-ignition-resources: &ignition-resources
  deploy:
    resources:
      limits:
        memory: 1536M
      reservations:
        memory: 512M
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-ignition-healthcheck: &ignition-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8088/StatusPing"]
  interval: 30s
  timeout: 10s
  retries: 10
  start_period: 90s

services:
  ignition-local:
    image: inductiveautomation/ignition:8.3.8
    container_name: lab05-ignition-local
    hostname: lab05-ignition-local
    user: "${LAB_UID:-2003}:0"
    group_add:
      - "${LAB_GID:-0}"
    entrypoint: *ignition-entrypoint
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
      - "${GATEWAY_GAN_PORT:-8060}:8060"
    volumes:
      - ignition-local-data:/usr/local/bin/ignition/data
      - ./projects:/usr/local/bin/ignition/data/projects
      - ./services/config:/usr/local/bin/ignition/data/config
      - ./services/modules.json:/usr/local/bin/ignition/data/modules.json
      - ./third-party-modules:/third-party-modules
    environment:
      <<: *ignition-env
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME_LOCAL:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD_LOCAL:-password}"
    command: >
      -n lab05-local
      -m 1024
      --
      wrapper.java.initmemory=256
      -Dignition.allowunsignedmodules=true
      -Dignition.gateway.externalModulesFolder=/third-party-modules
      -Dignition.config.mode=local-development
    healthcheck: *ignition-healthcheck
    <<: *ignition-resources
    networks:
      - default
    depends_on:
      timescaledb:
        condition: service_healthy

  ignition-test:
    image: "${IGNITION_TEST_IMAGE:-inductiveautomation/ignition:8.3.8}"
    container_name: lab05-ignition-test
    hostname: lab05-ignition-test
    user: "2003:0"
    group_add:
      - "${LAB_GID:-0}"
    entrypoint: *ignition-entrypoint
    restart: unless-stopped
    ports:
      - "${TEST_GATEWAY_PORT:-8089}:8088"
      - "${TEST_GATEWAY_GAN_PORT:-8061}:8060"
    environment:
      <<: *ignition-env
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME_TEST:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD_TEST:-password}"
    command: >
      -n lab05-test
      -m 1024
      --
      wrapper.java.initmemory=256
      -Dignition.allowunsignedmodules=true
      -Dignition.gateway.externalModulesFolder=/third-party-modules
      -Dignition.config.mode=test
    healthcheck: *ignition-healthcheck
    <<: *ignition-resources
    networks:
      - default
    depends_on:
      timescaledb:
        condition: service_healthy

  ignition-production:
    image: "${IGNITION_PRODUCTION_IMAGE:-inductiveautomation/ignition:8.3.8}"
    container_name: lab05-ignition-production
    hostname: lab05-ignition-production
    user: "2003:0"
    group_add:
      - "${LAB_GID:-0}"
    entrypoint: *ignition-entrypoint
    restart: unless-stopped
    ports:
      - "${PRODUCTION_GATEWAY_PORT:-8090}:8088"
      - "${PRODUCTION_GATEWAY_GAN_PORT:-8062}:8060"
    environment:
      <<: *ignition-env
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME_PRODUCTION:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD_PRODUCTION:-password}"
    command: >
      -n lab05-production
      -m 1024
      --
      wrapper.java.initmemory=256
      -Dignition.allowunsignedmodules=true
      -Dignition.gateway.externalModulesFolder=/third-party-modules
      -Dignition.config.mode=production
    healthcheck: *ignition-healthcheck
    <<: *ignition-resources
    networks:
      - default
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: lab05-timescaledb
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ignition}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ignition}"
      POSTGRES_DB: ignition_local_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ignition}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

volumes:
  ignition-local-data:
  timescaledb-data:
